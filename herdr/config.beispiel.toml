# Beispielkonfiguration für herdr, abgestimmt auf dieses Projekt.
# Nach ~/.config/herdr/config.toml übernehmen, unter Windows nach
# $env:APPDATA\herdr\config.toml (PowerShell) bzw. ($env.APPDATA | path join herdr config.toml) (Nushell),
# danach: herdr server reload-config. Befehle: docs/ARBEITSBLATT.md, Abschnitt 3.2.
# Stand: herdr 0.9.5

onboarding = false

[terminal]
default_shell = "nu"
new_cwd = "follow"

[worktrees]
directory = "~/Projects/.worktrees"

[ui]
agent_panel_sort = "priority"            # blockierte Agenten zuerst
status_indicators = "symbols"            # Status auch an der Form erkennbar
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"                      # Desktop-Benachrichtigung
delay_seconds = 2

[ui.sidebar.agents]
rows = [
  ["state_icon", "agent", "state_text"],
  ["workspace", "tab"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[keys]
switch_workspace = "prefix+shift+1..9"
next_agent = "prefix+a"
open_worktree = "prefix+shift+o"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "80%"
height = "80%"

# Läuft im Verzeichnis des aktiven Panes und bleibt bis zum Tastendruck offen.
[[keys.command]]
key = "prefix+alt+k"
type = "popup"
command = "nu scripts/konflikt-check.nu --warten"
description = "Konfliktprüfung"
width = "80%"
height = "60%"
